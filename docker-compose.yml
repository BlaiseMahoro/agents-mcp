services:
  searxng:
    image: searxng/searxng:latest
    ports:
      - "8888:8080"
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
    restart: unless-stopped

  # Not a long-running service: `docker compose build sandbox` builds the image
  # the execute agent starts one container from per run.
  sandbox:
    image: agents-sandbox:latest
    build: ./sandbox
    profiles: ["build-only"]
